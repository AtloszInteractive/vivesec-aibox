# 12. SZÁNDÉKOS NEHÉZSÉGEK (a terv 3. pontja) — a generálás ezeket építi be
# -----------------------------------------------------------------------------
difficulty_injections:
  - id: dif_scan
    kind: "scanned PDF (no text layer)"
    target_doc: "Vestkraft_PAC_Protocol_signed.pdf"
    drive: drive_legal
    expectation: "0 chunk + `extraction_empty` warning; OCR nélkül nem kereshető"
  - id: dif_xlsx
    kind: "spreadsheet with tables"
    target_doc: "Budget_2026_by_function.xlsx"
    drive: drive_finance
    expectation: "táblázatos számok kinyerése; a /finance parancs fő forrása"
  - id: dif_large
    kind: "large file (>1 MB)"
    target_doc: "GC3000_Firmware_v3_Test_Log_2026-06.txt"
    drive: drive_engineering
    expectation: "chunkolási és ingest-terhelés teszt"
  - id: dif_neardup
    kind: "near-duplicate"
    target_docs: ["Weekly_Status_2026-W25.md", "Weekly_Status_2026-W26.md"]
    drive: drive_engineering
    expectation: "a retrieval a HELYES hetet adja vissza, ne keverje"
  - id: dif_versions
    kind: "version chain v1 / v2 / final"
    target_docs:
      ["Helios_Project_Plan_v1.docx", "Helios_Project_Plan_v2.docx", "Helios_Project_Plan_final.docx"]
    drive: drive_engineering
    expectation: "az érvényes (final) verzióból idézzen; a v1 elavult dátumokat tartalmaz"
  - id: dif_multilang
    kind: "multilingual document set"
    target_docs:
      ["Reisekostenrichtlinie_v3_DE.pdf", "Rejsepolitik_v3_DA.pdf", "Utazasi_szabalyzat_v3_HU.pdf"]
    drive: drive_hr
    expectation: "azonos tartalom 3 nyelven; a válasz a kérdés nyelvén, a helyes per diemmel"
  - id: dif_numeric
    kind: "numeric-dense table dump"
    target_doc: "VoltStack2_Cycle_Test_Matrix.csv"
    drive: drive_engineering
    expectation: "karakter/szó arány őr — ne álljon elő 20 000 karakteres chunk"

