# -----------------------------------------------------------------------------
# 10. DRIVE-OK ÉS ACL (a korpusz fizikai és jogosultsági szerkezete)
# -----------------------------------------------------------------------------
drives:
  - id: drive_public
    name: public
    path: "/storage/drives/public"
    acl: all-staff
    description: "Mindenki számára elérhető céges anyagok"
    content: ["cégbemutató", "sajtóközlemények", "termék-adatlapok", "ISO tanúsítványok", "kézikönyv nyilvános része"]
  - id: drive_engineering
    name: engineering
    path: "/storage/drives/engineering"
    acl: engineering
    description: "Műszaki dokumentáció"
    content: ["specifikációk", "tesztjelentések", "projekttervek", "firmware release notes", "incidensnapló"]
  - id: drive_finance
    name: finance
    path: "/storage/drives/finance"
    acl: finance
    description: "Pénzügyi anyagok"
    content: ["negyedéves jelentések", "költségvetés", "forecast", "számlák", "kovenáns-riportok"]
  - id: drive_hr
    name: hr
    path: "/storage/drives/hr"
    acl: hr
    description: "Érzékeny HR anyagok — az ACL-teszt fő célpontja"
    content: ["bérsávok", "teljesítményértékelések", "munkaszerződések", "fegyelmi ügyek", "létszámterv"]
  - id: drive_legal
    name: legal
    path: "/storage/drives/legal"
    acl: legal
    description: "Szerződések és megfelelőségi anyagok"
    content: ["szerződések", "NDA-k", "auditjelentések", "kontroll-mátrix", "GDPR nyilvántartások"]

acl_groups:
  all-staff:
    drives: [drive_public]
    members: "minden munkavállaló"
  engineering:
    drives: [drive_public, drive_engineering]
  finance:
    drives: [drive_public, drive_finance]
  hr:
    drives: [drive_public, drive_hr]
  legal:
    drives: [drive_public, drive_legal]
  management:
    drives: [drive_public, drive_engineering, drive_finance, drive_hr, drive_legal]

acl_test_cases:
  - id: acl_01
    persona: p_lund
    question: "What are the salary bands for a senior engineer in 2026?"
    expected: "refusal / no context — a bérsávok a drive_hr-ben vannak, Sofie Lundnak nincs hr csoportja"
    leak_document: pol_bands
  - id: acl_02
    persona: p_lund
    question: "What was the gross margin in Q2 2026?"
    expected: "refusal / no context — drive_finance, nincs finance csoportja"
  - id: acl_03
    persona: p_kiss
    question: "How much is the ViVeSec annual fee?"
    expected: "refusal / no context — a szerződés a drive_legal-ban van"
  - id: acl_04
    persona: p_novak
    question: "What was the gross margin in Q2 2026?"
    expected: "válasz 43,1% forrásmegjelöléssel — van finance hozzáférése"
  - id: acl_05
    persona: p_barat
    question: "What are the open ISO 27001 non-conformities?"
    expected: "válasz NC-2026-01 és NC-2026-02 — management, mindent lát"

# -----------------------------------------------------------------------------
# 11. AMI NINCS A KORPUSZBAN — a T4 (elutasítandó) esetek hiteles forrása
#     A generálás során ezekről NEM készülhet dokumentum.
# -----------------------------------------------------------------------------
not_in_corpus:
  - topic: "Q3 2026 eredmény"
    reason: "A negyedév a demó időpontjában még nem zárult le."
    sample_question: "What was the revenue in Q3 2026?"
  - topic: "2027-es üzleti terv"
    reason: "Csak 2026 novemberében készül el."
    sample_question: "What is the 2027 revenue budget?"
  - topic: "Egyéni bérek"
    reason: "Csak bérsávok léteznek, konkrét személyre lebontott fizetés nincs egyetlen dokumentumban sem."
    sample_question: "How much does the CFO earn?"
  - topic: "USA-beli működés vagy ügyfél"
    reason: "A cég kizárólag európai piacokon van jelen."
    sample_question: "Who is our largest customer in the United States?"
  - topic: "APAC / kínai leányvállalat vagy gyár"
    reason: "Nincs ilyen entitás."
    sample_question: "When did the Shenzhen plant open?"
  - topic: "Folyamatban lévő peres ügy"
    reason: "A cégnek nincs peres ügye; csak szerződéses kötbérigény van a Nordcell felé."
    sample_question: "What litigation is Voltara currently involved in?"
  - topic: "Termékvisszahívás"
    reason: "Nem volt visszahívás."
    sample_question: "What was the root cause of the 2025 product recall?"
  - topic: "ISO 14001 tanúsítás"
    reason: "Csak ISO 27001 és ISO 9001 van."
    sample_question: "When was the ISO 14001 certificate issued?"
  - topic: "2026-os penetrációs teszt"
    reason: "Csak a 2025. októberi teszt jelentése létezik."
    sample_question: "What did the 2026 penetration test find?"
  - topic: "Felvásárlás vagy egyesülés"
    reason: "Nem volt és nem tervezett M&A tranzakció."
    sample_question: "Which company did Voltara acquire in 2025?"
  - topic: "Kriptovaluta / blockchain kezdeményezés"
    reason: "Nincs ilyen projekt."
    sample_question: "What is the status of the blockchain energy trading pilot?"
  - topic: "Osztalékfizetés"
    reason: "A társaság alapítása óta nem fizetett osztalékot, és nincs ilyen board-döntés."
    sample_question: "How much dividend was paid for FY2025?"

