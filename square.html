<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Three.js Alap Példa</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <!-- Az ES Modules segítségével importáljuk a Three.js könyvtárat -->
    <script type="module">
        import * as THREE from 'https://unpkg.com';

        // 1. Színtér létrehozása
        const scene = new THREE.Scene();

        // 2. Kamera beállítása (Látószög, Képarány, Közeli vágósík, Távoli vágósík)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        // 3. Megjelenítő létrehozása és hozzáadása a HTML-hez
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 4. Kocka létrehozása (Geometria + Anyag = Mesh)
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // 5. Animációs ciklus (Render loop)
        function animate() {
            requestAnimationFrame(animate);

            // Kocka forgatása minden képkockánál
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;

            // Színtér újrarenderelése a kamera nézetéből
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
